openapi: 3.0.3
info:
  title: Lab 7 API Specification
  version: 1.0.0
  description: |
    Спецификация эндпоинтов для лабораторной работы №7.
    Изменения относительно ЛР-5:
    - Добавлены эндпоинты аутентификации: /auth/register, /auth/login.
    - Добавлена JWT-аутентификация (Bearer token).
    - Защищены эндпоинты по ролям (USER, ADMIN).
    - OrderCreateRequest больше не содержит userId — пользователь определяется из JWT.
    - Добавлены ответы 401 (Unauthorized) и 403 (Forbidden).

servers:
  - url: http://localhost:8080

tags:
  - name: Auth
    description: Регистрация и аутентификация
  - name: Users
    description: Управление пользователями (ADMIN)
  - name: Restaurants
  - name: Dishes
  - name: Orders

paths:
  # ── Auth ──

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Регистрация нового пользователя
      description: |
        Создаёт нового пользователя с ролью USER.
        Возвращает JWT-токен для дальнейших запросов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Аутентификация пользователя
      description: |
        Проверяет credentials и возвращает JWT-токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Users (ADMIN) ──

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Получить список пользователей
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Users]
      operationId: getUserById
      summary: Получить пользователя по id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Users]
      operationId: updateUser
      summary: Обновить пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Удалить пользователя
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Restaurants ──

  /api/v1/restaurants:
    get:
      tags: [Restaurants]
      operationId: listRestaurants
      summary: Получить список ресторанов
      description: Публичный эндпоинт — доступен без аутентификации.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RestaurantResponse"
    post:
      tags: [Restaurants]
      operationId: createRestaurant
      summary: Создать ресторан
      description: Только для ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Restaurant with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/restaurants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Restaurants]
      operationId: getRestaurantById
      summary: Получить ресторан по id
      description: Публичный эндпоинт — доступен без аутентификации.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Restaurants]
      operationId: updateRestaurant
      summary: Обновить ресторан
      description: Только для ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Restaurants]
      operationId: deleteRestaurant
      summary: Удалить ресторан
      description: Только для ADMIN.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/restaurants/{id}/dishes:
    parameters:
      - name: id
        in: path
        required: true
        description: ID ресторана
        schema:
          type: integer
          format: int64
    get:
      tags: [Restaurants]
      operationId: getRestaurantDishes
      summary: Получить меню ресторана (список блюд)
      description: |
        Публичный эндпоинт — доступен без аутентификации.
        Возвращает все блюда, принадлежащие данному ресторану.
        Должно загружаться без N+1 (через @EntityGraph или JOIN FETCH).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishResponse"
        "404":
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/restaurants/{restaurantId}/dishes:
    parameters:
      - name: restaurantId
        in: path
        required: true
        description: ID ресторана, в который добавляется блюдо
        schema:
          type: integer
          format: int64
    post:
      tags: [Dishes]
      operationId: createDishInRestaurant
      summary: Добавить блюдо в ресторан
      description: |
        Только для ADMIN.
        Создаёт новое блюдо и привязывает его к указанному ресторану.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Dishes ──

  /api/v1/dishes:
    get:
      tags: [Dishes]
      operationId: listDishes
      summary: Получить список блюд (опционально с фильтром по имени)
      description: Публичный эндпоинт — доступен без аутентификации.
      parameters:
        - name: namePart
          in: query
          required: false
          description: Опциональный фильтр по части имени блюда
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishResponse"

  /api/v1/dishes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Dishes]
      operationId: getDishById
      summary: Получить блюдо по id
      description: Публичный эндпоинт — доступен без аутентификации.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Dishes]
      operationId: updateDish
      summary: Обновить блюдо
      description: Только для ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Dishes]
      operationId: deleteDish
      summary: Удалить блюдо
      description: Только для ADMIN.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Orders ──

  /api/v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Получить список заказов
      description: |
        ADMIN видит все заказы (с опциональными фильтрами).
        USER видит только свои заказы.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Фильтр по статусу заказа
          schema:
            type: string
            enum: [PENDING, CONFIRMED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Создать заказ
      description: |
        Создаёт заказ для текущего аутентифицированного пользователя.
        userId определяется из JWT-токена, передавать его в теле не нужно.
        Статус нового заказа — PENDING.
        Все указанные dishIds должны существовать, иначе — ошибка 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Validation error (dish not found, empty dish list)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Получить заказ по id
      description: |
        USER может просматривать только свои заказы.
        ADMIN может просматривать любой заказ.
        Возвращает заказ с полной информацией: пользователь и список блюд.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Заказ принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [Orders]
      operationId: updateOrderStatus
      summary: Обновить статус заказа
      description: Только для ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT-токен, полученный через /auth/login или /auth/register"

  responses:
    Unauthorized:
      description: Не аутентифицирован (отсутствует или невалидный токен)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 401
            message: "Требуется аутентификация"
            timestamp: "2026-04-02T12:00:00"

    Forbidden:
      description: Доступ запрещён (недостаточно прав)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 403
            message: "Доступ запрещён"
            timestamp: "2026-04-02T12:00:00"

  schemas:
    # ── Auth ──

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: "secret123"
        name:
          type: string
          minLength: 1
          example: "Иван Петров"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: "secret123"

    AuthResponse:
      type: object
      required: [token, email, role]
      properties:
        token:
          type: string
          description: JWT-токен для Authorization header
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyQGV4YW1wbGUuY29tIn0..."
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER

    # ── Users ──

    UserUpdateRequest:
      type: object
      required: [email, firstName, lastName, isActive]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        isActive:
          type: boolean

    UserResponse:
      type: object
      required: [id, email, firstName, lastName, isActive, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
        role:
          type: string
          enum: [USER, ADMIN]

    # ── Restaurants ──

    RestaurantCreateRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
          example: "Pizza Place"
        address:
          type: string
          minLength: 1
          example: "ул. Пушкина, д. 10"

    RestaurantUpdateRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1

    RestaurantResponse:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string

    # ── Dishes ──

    DishCreateRequest:
      type: object
      required: [name, description, price, isAvailable]
      properties:
        name:
          type: string
          minLength: 1
          example: Margherita
        description:
          type: string
          minLength: 1
          example: Classic pizza with tomato sauce and mozzarella
        price:
          type: number
          format: double
          minimum: 0
          example: 499.0
        isAvailable:
          type: boolean
          example: true

    DishUpdateRequest:
      type: object
      required: [name, description, price, isAvailable]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        price:
          type: number
          format: double
          minimum: 0
        isAvailable:
          type: boolean

    DishResponse:
      type: object
      required: [id, name, description, price, isAvailable, restaurantId]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        isAvailable:
          type: boolean
        restaurantId:
          type: integer
          format: int64

    # ── Orders ──

    OrderCreateRequest:
      type: object
      required: [dishIds]
      properties:
        dishIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, DELIVERED, CANCELLED]
          example: CONFIRMED

    OrderResponse:
      type: object
      required: [id, userId, status, createdAt, dishes]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, CONFIRMED, DELIVERED, CANCELLED]
        createdAt:
          type: string
          format: date-time
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/DishResponse"

    # ── Errors ──

    ErrorResponse:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          nullable: true
          example: "Ресторан с id=10 не найден"
        timestamp:
          type: string
          format: date-time

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
              example:
                name: "Название не может быть пустым"
                price: "Цена должна быть больше 0"
